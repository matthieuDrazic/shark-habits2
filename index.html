<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><title>SharkHabits V16.2</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>SHARKHABITS V16.2</small><h1 id="title">Aujourd’hui</h1></div><button id="settingsBtn" class="icon">⚙︎</button></header><main>
<section id="today" class="page active"><div id="week" class="week"></div><div class="summary"><div><span>Progression</span><strong id="dayScore">0 %</strong></div><div class="bar"><i id="dayBar"></i></div></div><div id="todayGroups"></div><button class="fab" id="newGoal">＋</button></section>
<section id="reports" class="page"><div class="seg"><button class="active" data-report="all">Tous</button><button data-report="good">Dans le rythme</button><button data-report="late">À surveiller</button></div><div class="seg periodTabs"><button class="active" data-period="week">Semaine</button><button data-period="month">Mois</button><button data-period="year">Année</button><button data-period="all">Tout</button></div><div id="reportSummary"></div><div id="reportList"></div></section>
<section id="ocean" class="page"><div class="sectionHead"><div><span class="eyebrow">MON OCÉAN</span><h2>Aquarium</h2></div><strong>🦷 <span id="teeth">0</span></strong></div><button id="oceanCard" class="aquariumCard"><div id="aquariumPreview" class="aquariumScene"></div><span>Agrandir l’aquarium ↗</span></button><div class="oceanActions"><button id="decorate">Décorer</button><button id="manageSharks">Requins</button></div></section>
<section id="sharks" class="page legacyHidden"><div class="sectionHead"><h2>Sharkdex</h2><span id="ownedCount"></span></div><div id="sharkGrid" class="grid"></div></section>
<section id="shop" class="page"><div class="sectionHead"><h2>Boutique</h2><strong>🦷 <span id="shopTeeth">0</span></strong></div><div class="seg"><button class="active" data-shop="sharks">Requins</button><button data-shop="decor">Décorations</button><button data-shop="collection">Collection</button></div><div id="shopGrid" class="grid"></div></section></main>
<nav><button data-page="today" class="active">✓<span>Aujourd’hui</span></button><button data-page="reports">▥<span>Rapports</span></button><button data-page="ocean">≈<span>Océan</span></button><button data-page="shop">🛒<span>Boutique</span></button></nav>
<dialog id="goalDialog"><form id="goalForm"><div class="dialogHead"><button type="button" data-close>Annuler</button><h3 id="goalDialogTitle">Nouveau suivi</h3><button type="submit">Enregistrer</button></div><input type="hidden" name="id"><label>Nom<input name="name" required placeholder="Ex. Course"></label><label>Type<select name="type"><option value="habit">Habitude / occurrences</option><option value="cumulative">Cumul chiffré</option><option value="metric">Mesure évolutive</option><option value="deadline">Objectif à échéance</option></select></label><div class="two"><label>Objectif<input name="target" type="number" step="0.1" required></label><label>Unité<input name="unit" placeholder="km, kg…"></label></div><label>Répétition<select name="repeat"><option value="day">Chaque jour</option><option value="week">Chaque semaine</option><option value="month">Chaque mois</option><option value="once">Jusqu’à une date</option></select></label><label>Direction de la mesure<select name="direction"><option value="auto">Automatique</option><option value="decrease">↓ Diminuer</option><option value="increase">↑ Augmenter</option><option value="maintain">≈ Maintenir</option></select></label><label>Valeur de départ (mesure)<input name="startValue" type="number" step="0.1"></label><label>Échéance<input name="deadline" type="date"></label><label>Règle<select name="rule"><option value="atleast">Au moins</option><option value="atmost">Au plus</option><option value="about">Environ</option></select></label><label>Planning<select name="scheduleMode"><option value="everyday">Tous les jours</option><option value="days">Certains jours</option><option value="timesweek">X fois par semaine</option><option value="period">Selon la période</option></select></label><div class="scheduleDays"><span>Jours prévus</span><div class="weekdayChecks"><label><input type="checkbox" name="day" value="1">L</label><label><input type="checkbox" name="day" value="2">M</label><label><input type="checkbox" name="day" value="3">M</label><label><input type="checkbox" name="day" value="4">J</label><label><input type="checkbox" name="day" value="5">V</label><label><input type="checkbox" name="day" value="6">S</label><label><input type="checkbox" name="day" value="0">D</label></div></div><label>Fois par semaine<input name="timesPerWeek" type="number" min="1" max="7" value="3"></label><label>Note<input name="note" placeholder="Facultatif"></label><label>Catégorie<select name="category"><option>Sport</option><option>Santé</option><option>Maison</option><option>Personnel</option><option>Autre</option></select></label></form></dialog>
<dialog id="entryDialog"><form id="entryForm"><div class="dialogHead"><button type="button" data-close>Annuler</button><h3 id="entryTitle">Ajouter</h3><button type="submit">Valider</button></div><input type="hidden" name="goal"><label>Valeur<input name="value" type="number" step="0.01" required></label><label>Date<input name="date" type="date" required></label></form></dialog>
<dialog id="detailDialog" class="sheet"><div class="dialogHead"><button type="button" data-close>✕</button><h3 id="detailTitle">Objectif</h3><button id="editGoal" type="button">Modifier</button></div><div id="detailBody"></div></dialog>
<dialog id="aquariumDialog" class="full"><div class="dialogHead"><button type="button" data-close>‹ Retour</button><h3>Aquarium</h3><button id="editAquarium">Décorer</button></div><div id="aquariumFull" class="aquariumScene fullScene"></div><div id="inventory" class="inventory aquariumTray"></div></dialog><script src="app.js"></script></body></html>
